header:
  version: 14

repos:
  # In-tree project layer.  This repo (the one containing the kas
  # config) is referenced with no `url`, so kas adds the layer that
  # lives alongside the kas files instead of cloning it.  The previous
  # external fetch was dropped in #71 ("Acaida" typo); the layer was
  # never re-registered, which is why bitbake reported
  # "Nothing PROVIDES 'acadia-image'".
  meta-acadia:
    layers:
      meta/meta-acadia:
