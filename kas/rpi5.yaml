header:
  version: 14

machine: raspberrypi5
distro: poky
target: core-image-full-cmdline

# All external layers are cloned into meta/ to keep the project root clean.
repos:
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    path: layers/poky
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    branch: scarthgap
    path: layers/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    branch: scarthgap
    commit: 2c646d29912dcc873469a57b1c207e1549c5094d
    path: layers/meta-raspberrypi

  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate
    branch: scarthgap
    path: layers/meta-swupdate

  meta-custom:
    path: meta/meta-custom
    layers:
      .:

local_conf_header:
  rpi5: |
    # Init manager
    INIT_MANAGER = "systemd"

    # SD card image output
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4"
    WKS_FILE      = "sdimage-rpi5.wks"

    # Raspberry Pi settings
    ENABLE_UART = "1"
    GPU_MEM     = "128"

    # Accept proprietary firmware licence required by meta-raspberrypi
    LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"

    # Shared caches (bind-mounted by Docker)
    DL_DIR     ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

    # SWUpdate: enable built-in Mongoose web server and progress IPC
    PACKAGECONFIG:append:pn-swupdate = " webserver"

