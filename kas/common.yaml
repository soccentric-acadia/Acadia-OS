header:
  version: 14
  includes:
    - repos/poky.yaml
    - repos/meta-openembedded.yaml
    - repos/meta-raspberrypi.yaml
    - repos/meta-swupdate.yaml
    - repos/meta-acadia.yaml

distro: poky
target: acadia-image

local_conf_header:
  base: |
    # Init manager
    INIT_MANAGER = "systemd"

    # SD card image output
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4"

    # Raspberry Pi settings
    ENABLE_UART = "1"
    GPU_MEM     = "128"
    # NOTE: do not add `synaptics-killswitch` here.  meta-raspberrypi
    # does not ship that recipe, and the flag is a no-op for the
    # Raspberry Pi family.  If a future BSP port needs it, add a
    # comment here explaining which BSP — see issue #93.

    # Shared caches (bind-mounted by Docker)
    DL_DIR     ?= "${TOPDIR}/../cache/downloads"
    SSTATE_DIR ?= "${TOPDIR}/../cache/sstate-cache"

    # SWUpdate: enable built-in Mongoose web server and progress IPC
    PACKAGECONFIG:append:pn-swupdate = " webserver"

    # Required by Poky sanity checks (must match LOCALCONF_VERSION in poky)
    CONF_VERSION = "2"

    # CM-13 OTA rollback/A-B redundancy
    UBOOT_ENV_SUFFIX = "scr"
    UBOOT_ENV = "boot"
    MACHINE_FEATURES:append = " u-boot"
    RPI_USE_U_BOOT = "1"
    
    # Enable bootcount in U-Boot
    UBOOT_MACHINE = "rpi_arm64_defconfig"
    EXTRA_IMAGEDEPENDS += "u-boot"
    IMAGE_INSTALL:append = " u-boot-fw-utils"

    # Swupdate specific variables
    SWUPDATE_INIT = "systemd"

    # Configurable license flags for platform components that require
    # explicit acceptance (feature.txt §11). Empty by default; extend via
    # a board's local_conf_header (or LICENSE_FLAGS_ACCEPTED on the make
    # command line) if a recipe's LICENSE_FLAGS trips a build failure —
    # e.g. proprietary firmware or a commercially-licensed codec.
    LICENSE_FLAGS_ACCEPTED ?= ""

    # Ptest package and runner support (feature.txt §6 / §12). Requires
    # "ptest" in DISTRO_FEATURES so recipes build their -ptest packages;
    # IMAGE_FEATURES += "ptest-pkgs" (acadia-image.bb) installs them.
    DISTRO_FEATURES:append = " ptest"

    # SDK: include dev-pkgs (headers), dbg-pkgs (debug symbols), and
    # target-side debugging/profiling tools in the toolchain payload
    # (feature.txt §8: "Development headers, source, and debug symbols
    # available in SDK output" / "gdbserver, perf, trace-cmd, valgrind,
    # and ptest support in SDK workflows").
    SDKIMAGE_FEATURES:append = " dev-pkgs dbg-pkgs tools-debug tools-profile"
    TOOLCHAIN_TARGET_TASK:append = " gdbserver perf trace-cmd"

    # Configurable product/platform kernel boot arguments (feature.txt §3).
    # Empty by default; override ACADIA_EXTRA_CMDLINE per-board
    # (local_conf_header) to append product-specific console/root/delay
    # arguments to /boot/cmdline.txt without touching the base CMDLINE.
    ACADIA_EXTRA_CMDLINE ?= ""
    CMDLINE:append = " ${ACADIA_EXTRA_CMDLINE}"
