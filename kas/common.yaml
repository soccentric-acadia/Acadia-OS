header:
  version: 14
  includes:
    - repos/poky.yaml
    - repos/meta-openembedded.yaml
    - repos/meta-raspberrypi.yaml
    - repos/meta-swupdate.yaml
    - repos/meta-acadia.yaml

distro: poky
target: acadia-image

local_conf_header:
  base: |
    # Init manager
    INIT_MANAGER = "systemd"

    # SD card image output
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4"

    # Raspberry Pi settings
    ENABLE_UART = "1"
    GPU_MEM     = "128"
    # NOTE: do not add `synaptics-killswitch` here.  meta-raspberrypi
    # does not ship that recipe, and the flag is a no-op for the
    # Raspberry Pi family.  If a future BSP port needs it, add a
    # comment here explaining which BSP — see issue #93.

    # Shared caches (bind-mounted by Docker)
    DL_DIR     ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

    # SWUpdate: enable built-in Mongoose web server and progress IPC
    PACKAGECONFIG:append:pn-swupdate = " webserver"

    # Required by Poky sanity checks (must match LOCALCONF_VERSION in poky)
    CONF_VERSION = "2"

    # CM-13 OTA rollback/A-B redundancy
    UBOOT_ENV_SUFFIX = "scr"
    UBOOT_ENV = "boot"
    MACHINE_FEATURES:append = " u-boot"
    RPI_USE_U_BOOT = "1"
    
    # Enable bootcount in U-Boot
    UBOOT_MACHINE = "rpi_arm64_defconfig"
    EXTRA_IMAGEDEPENDS += "u-boot"
    IMAGE_INSTALL:append = " u-boot-fw-utils"

    # Swupdate specific variables
    SWUPDATE_INIT = "systemd"
