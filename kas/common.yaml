header:
  version: 14
  includes:
  - repos/poky.yaml
  - repos/meta-openembedded.yaml
  - repos/meta-raspberrypi.yaml
  - repos/meta-swupdate.yaml
  - repos/meta-lts-mixins.yaml
  - repos/meta-acadia.yaml

distro: poky
target: acadia-image

local_conf_header:
  # Private GitHub repos must be fetched over SSH only (protocol=ssh in the
  # recipes).  BitBake overrides HOME with a temp dir for fetch tasks, so
  # ssh cannot find ~/.ssh and the fetch falls back to OE-core's default
  # https mirrors, which can never serve a private repo.  kas-container
  # mounts KAS_SSH_DIR at /var/kas/userdata/.ssh (read-only) — point ssh at
  # that absolute path so the key is found regardless of HOME.
  ssh-fetch: |
    export GIT_SSH_COMMAND = "ssh -o IdentitiesOnly=yes -i /var/kas/userdata/.ssh/id_rsa -o UserKnownHostsFile=/var/kas/userdata/.ssh/known_hosts -o StrictHostKeyChecking=accept-new"

  base: |
    # Init manager
    INIT_MANAGER = "systemd"

    # SD card image output
    IMAGE_FSTYPES = "wic.bz2 wic.bmap ext4"

    # Raspberry Pi settings
    # F04 / OS-005 console policy (T-P14): the UART stays enabled as the
    # support/bring-up console. There is NO autologin and no default
    # credential: root is locked (OS-001), the operator/rpi accounts are
    # locked until first use (T-P11), and the console only ever reaches a
    # login prompt. The SWUpdate web UI (the other console-printed secret,
    # its per-boot password) was removed entirely (F12).
    ENABLE_UART = "1"
    GPU_MEM     = "128"
    # NOTE: do not add `synaptics-killswitch` here.  meta-raspberrypi
    # does not ship that recipe, and the flag is a no-op for the
    # Raspberry Pi family.  If a future BSP port needs it, add a
    # comment here explaining which BSP — see issue #93.

    # ── Hardware enablement overlays (task.md) ────────────────────────────────
    # These dtoverlay/dtparam lines are appended to /boot/config.txt via
    # RPI_EXTRA_CONFIG (meta-raspberrypi's rpi-config recipe).  Each closes a
    # task.md checklist item:
    #   w1-gpio        → 1-Wire bus for temperature probes (GPIO/Sensors)
    #   pwm            → PWM for actuator/motor control (GPIO/Sensors)
    #   mcp2515-can0   → SPI CAN transceiver (GPIO/Sensors)
    #   rpi-poe        → PoE+ HAT fan/power negotiation (Power/Thermal)
    #   gpio-shutdown  → soft-shutdown power button (Power/Thermal)
    #   i2c-rtc        → RTC battery header (Power/Thermal)
    #   vc4-kms-v3d    → full KMS (pinned per-board; see kas/boards/*.yaml)
    # Override per-deployment by setting RPI_EXTRA_CONFIG in a board's
    # local_conf_header (or on the make command line).
    RPI_EXTRA_CONFIG ?= " \
        # T-P15: Pico W co-processor link on RP1 UART2 (GPIO0/1) — the HAT
        # ID-EEPROM function of those pins is unused on this board (module
        # EEPROM is on I2C1). Expected node /dev/ttyAMA2 (HIL-verify).
        dtoverlay=uart2 \
        dtoverlay=w1-gpio \
        dtoverlay=pwm \
        dtoverlay=mcp2515-can0,oscillator=16000000,interrupt=25 \
        dtoverlay=rpi-poe \
        dtoverlay=gpio-shutdown \
        dtoverlay=i2c-rtc,pcf8523 \
    "

    # ── Camera / media GPU memory split (task.md Camera-Video) ───────────────
    # A larger GPU_MEM is required for the camera ISP/Unicam pipeline and
    # hardware video decode.  The base 128 MB is kept for headless/industrial
    # profiles; camera deployments should raise this (e.g. 256) per board.
    GPU_MEM_CAMERA ?= "256"

    # ── HEVC / H.265 decode license flag (task.md Camera-Video) ──────────────
    # GStreamer's stateless V4L2 HEVC decoder and ffmpeg's HEVC path are
    # covered by the 'commercial' license flag in poky.  Accept it here so
    # the H.265 decode packages build; override per-deployment if a
    # deployment must not ship the commercial codec.
    LICENSE_FLAGS_ACCEPTED ?= "commercial"

    # Shared caches (bind-mounted by Docker)
    DL_DIR     ?= "${TOPDIR}/../cache/downloads"
    SSTATE_DIR ?= "${TOPDIR}/../cache/sstate-cache"

    # SWUpdate: enable built-in Mongoose web server and progress IPC
    PACKAGECONFIG:append:pn-swupdate = " webserver"

    # Required by Poky sanity checks (must match LOCALCONF_VERSION in poky)
    CONF_VERSION = "2"

    # CM-13 OTA rollback/A-B redundancy
    UBOOT_ENV_SUFFIX = "scr"
    UBOOT_ENV = "boot"
    MACHINE_FEATURES:append = " u-boot"
    RPI_USE_U_BOOT = "1"

    # Enable bootcount in U-Boot
    UBOOT_MACHINE = "rpi_arm64_defconfig"
    EXTRA_IMAGEDEPENDS += "u-boot"
    IMAGE_INSTALL:append = " u-boot-fw-utils"

    # Swupdate specific variables
    SWUPDATE_INIT = "systemd"

    # Configurable license flags for platform components that require
    # explicit acceptance (feature.txt §11). Empty by default; extend via
    # a board's local_conf_header (or LICENSE_FLAGS_ACCEPTED on the make
    # command line) if a recipe's LICENSE_FLAGS trips a build failure —
    # e.g. proprietary firmware or a commercially-licensed codec.
    # (The 'commercial' flag is accepted above for the HEVC/H.265 decode
    # path; see the Camera/Video section.)
    LICENSE_FLAGS_ACCEPTED ?= "commercial"

    # Ptest package and runner support (feature.txt §6 / §12). Requires
    # "ptest" in DISTRO_FEATURES so recipes build their -ptest packages;
    # IMAGE_FEATURES += "ptest-pkgs" (acadia-image.bb) installs them.
    DISTRO_FEATURES:append = " ptest"

    # SDK: include dev-pkgs (headers), dbg-pkgs (debug symbols), and
    # target-side debugging/profiling tools in the toolchain payload
    # (feature.txt §8: "Development headers, source, and debug symbols
    # available in SDK output" / "gdbserver, perf, trace-cmd, valgrind,
    # and ptest support in SDK workflows").
    SDKIMAGE_FEATURES:append = " dev-pkgs dbg-pkgs tools-debug tools-profile"
    TOOLCHAIN_TARGET_TASK:append = " gdbserver perf trace-cmd"

    # Configurable product/platform kernel boot arguments (feature.txt §3).
    # Empty by default; override ACADIA_EXTRA_CMDLINE per-board
    # (local_conf_header) to append product-specific console/root/delay
    # arguments to /boot/cmdline.txt without touching the base CMDLINE.
    ACADIA_EXTRA_CMDLINE ?= ""
    CMDLINE:append = " ${ACADIA_EXTRA_CMDLINE}"
