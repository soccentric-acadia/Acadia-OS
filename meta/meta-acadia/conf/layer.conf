BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-acadia"
# BBFILE_PATTERN must anchor on ${LAYERDIR} (the directory holding
# this conf).  BitBake uses this regex to map each parsed .bb file
# back to its owning layer for LAYERVERSION reporting and
# layer-dependency checks.  ${LAYERDIR} resolves to
# meta/meta-acadia/ in the standalone repo checkout, so the pattern
# matches every ${LAYERDIR}/recipes-*/*/*.bb.  Do not change the
# anchor to a relative path or to the repo root — BitBake is rooted
# at the conf directory, not the git worktree.
BBFILE_PATTERN_meta-acadia = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-acadia = "10"

LAYERDEPENDS_meta-acadia = "core raspberrypi"
LAYERSERIES_COMPAT_meta-acadia = "scarthgap"
