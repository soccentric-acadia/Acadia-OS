name: Build Acadia OS

on:
  push:
    branches: [main, scarthgap]
  pull_request:
    branches: [main, scarthgap]
  # Allow manual trigger for testing builds against a specific board.
  # Issue #41: the inputs were declared but never read — the matrix
  # was hardcoded to [rpi5].  Wire the inputs to the matrix so a
  # manual run can target a different board / image recipe.
  workflow_dispatch:
    inputs:
      board:
        description: 'Target board'
        required: true
        default: 'rpi5'
        type: choice
        # Issue #41: board list is sourced from the same set the
        # local `make` completion uses (see rpi-make-completion.bash).
        # Add new boards here AND in the Makefile completion list to
        # keep the two in sync.  If you forget the Makefile, the
        # completion will offer a board the CI cannot build.
        options: [rpi5, rpi4-64, cm5]
      image_target:
        description: 'Image recipe'
        required: true
        default: 'acadia-image'
        type: choice
        options: [acadia-image]

jobs:
  build:
    name: Yocto build — ${{ matrix.board }}
    runs-on: ubuntu-22.04
    # Issue #41: the matrix `board` is the workflow_dispatch input
    # if this is a manual run, else `rpi5` for push/PR.  `image_target`
    # similarly threads through.  on-push / on-PR builds keep the
    # historical rpi5-only default — manual triggers can override.
    strategy:
      fail-fast: false
      matrix:
        board: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["%s"]', github.event.inputs.board)) || fromJSON('["rpi5"]') }}
        image_target: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["%s"]', github.event.inputs.image_target)) || fromJSON('["acadia-image"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Docker layer cache ─────────────────────────────────────────────────
      - name: Cache kas Docker image
        uses: actions/cache@v4
        with:
          path: /tmp/kas-image.tar
          key: kas-image-${{ hashFiles('docker/yocto/Dockerfile') }}

      # ── sstate + download caches ───────────────────────────────────────────
      # The sstate cache is keyed by Yocto release + machine so different
      # boards share the same host tools entries.
      - name: Restore sstate cache
        uses: actions/cache@v4
        with:
          path: sstate-cache
          key: sstate-${{ matrix.board }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            sstate-${{ matrix.board }}-${{ github.ref_name }}-
            sstate-${{ matrix.board }}-

      - name: Restore downloads cache
        uses: actions/cache@v4
        with:
          path: downloads
          key: downloads-${{ hashFiles('kas/**') }}-${{ github.sha }}
          restore-keys: |
            downloads-${{ hashFiles('kas/**') }}-
            downloads-

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Install kas
        run: |
          pip3 install --quiet kas

      - name: Run Yocto build via kas
        env:
          KAS_BUILD_DIR: ${{ github.workspace }}/build
          DL_DIR:        ${{ github.workspace }}/downloads
          SSTATE_DIR:    ${{ github.workspace }}/sstate-cache
        run: |
          kas build kas/boards/${{ matrix.board }}.yaml --target ${{ matrix.image_target }}

      # ── Collect artifacts ──────────────────────────────────────────────────
      - name: Upload SD card image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image_target }}-${{ matrix.board }}-${{ github.sha }}
          path: |
            build/tmp/deploy/images/**/*.wic.bz2
            build/tmp/deploy/images/**/*.wic.bmap
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.board }}-${{ github.sha }}
          path: |
            build/tmp/log/
            build/tmp/work/**/temp/log.*
          retention-days: 7
